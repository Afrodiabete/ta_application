services:
  db:
    image: mariadb:10.11
    container_name: ta_application-db
    restart: always
    env_file:
      - .env
    volumes:
      - ./mariadb_data:/var/lib/mysql
    environment:
      MARIADB_DATABASE: ${POSTGRES_DB}
      MARIADB_USER: ${POSTGRES_USER}
      MARIADB_PASSWORD: ${POSTGRES_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "${POSTGRES_USER}", "-p${POSTGRES_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build: ./app
    container_name: ta_application-web
    command: ["sh", "./entrypoint.sh"] 
    env_file:
      - .env
    ports:
      - "80:5000"
    volumes:
      - ./app:/app
    environment:
      - DB_TYPE=mariadb
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - DB_PORT=3306
      - VM_IP=${VM_IP:-}
      - AUTO_UPDATE=${AUTO_UPDATE:-false}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb_data:
    driver: local