<!DOCTYPE html>
<html lang="en" class="h-full" data-theme="corporate">

<head>
	<title>{% block title %}{% endblock %}</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	{% load static %}
	<!-- Tailwind and DaisyUI CDN -->
	<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<script>
		tailwind.config = {
			theme: {
				extend: {},
			},
			daisyui: {
				themes: ["light", "dark", "cupcake", "bumblebee", "emerald", "corporate", "synthwave", "retro", "cyberpunk", "valentine", "halloween", "garden", "forest", "aqua", "lofi", "pastel", "fantasy", "wireframe", "black", "luxury", "dracula", "cmyk", "autumn", "business", "acid", "lemonade", "night", "coffee", "winter"],
			},
		}
		const theme = 'corporate';
		document.documentElement.setAttribute('data-theme', theme);
		localStorage.setItem('theme', theme);
	</script>
</head>

<body class="min-h-screen bg-base-100 text-base-content flex flex-col">

	<main class="container mx-auto p-4 flex-grow">
		{% block content %}{% endblock %}
	</main>

	<footer class="footer sm:footer-horizontal footer-center bg-base-300 text-base-content p-4 mt-auto">
		<aside>
			<p>&copy; 2026 {{ INST_NAME }}. All rights reserved.</p>
			<p>Misuse of this system is prohibited and will result in disciplinary action.</p>
			<p class="opacity-0 hover:opacity-100 transition-opacity delay-500 duration-1000 cursor-default">
				Made by <a href="https://github.com/ItzPabz" target="_blank" rel="noopener noreferrer"
					class="link link-hover">Pablo</a>
			</p>
		</aside>
	</footer>

	{% if messages %}
	<div class="toast toast-top toast-center">
		{% for message in messages %}
		<div
			class="alert {% if message.tags == 'success' %}alert-success{% elif message.tags == 'error' %}alert-error{% elif message.tags == 'warning' %}alert-warning{% elif message.tags == 'info' %}alert-info{% endif %}">
			<span>{{ message }}</span>
		</div>
		{% endfor %}
	</div>
	<script>
		document.addEventListener('DOMContentLoaded', function () {
			const messages = document.querySelectorAll('.alert');
			messages.forEach(message => {
				setTimeout(() => {
					message.classList.add('opacity-0');
					setTimeout(() => message.remove(), 300);
				}, 4000);
			});
		});
	</script>
	{% endif %}

	<script>
		const themeToggleBtn = document.getElementById('theme-toggle');
		const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
		const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

		function updateIcons() {
			if (!themeToggleDarkIcon || !themeToggleLightIcon) return;
			const isDark = document.documentElement.getAttribute('data-theme') === 'business';
			themeToggleDarkIcon.style.display = isDark ? 'none' : 'inline-block';
			themeToggleLightIcon.style.display = isDark ? 'inline-block' : 'none';
		}

		if (themeToggleBtn) {
			updateIcons();

			themeToggleBtn.addEventListener('click', function () {
				const currentTheme = document.documentElement.getAttribute('data-theme');
				const newTheme = currentTheme === 'business' ? 'light' : 'business';

				document.documentElement.setAttribute('data-theme', newTheme);
				localStorage.setItem('theme', newTheme);
				updateIcons();
			});
		}
	</script>
</body>

</html>
